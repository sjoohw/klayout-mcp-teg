name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - run: uv run --frozen python -m compileall -q src tests scripts
      - run: uv run --frozen python -m pytest -q --junitxml=pytest-results.xml
      - if: always() && hashFiles('pytest-results.xml') != ''
        run: >-
          uv run --frozen python scripts/write_ci_validation.py
          --junit pytest-results.xml --output validation.json
          --commit ${{ github.sha }} --job unit-${{ matrix.os }}-${{ matrix.python }}
      - if: always() && hashFiles('validation.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: validation-unit-${{ matrix.os }}-${{ matrix.python }}
          path: validation.json

  linux-csh-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y csh
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev
      - run: csh scripts/run-klayout-teg-mcp.csh </dev/null

  klayout-integration:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install KLayout 0.30.10
        run: |
          curl -fsSLo klayout.deb https://www.klayout.org/downloads/Ubuntu-24/klayout_0.30.10-1_amd64.deb
          echo "674a26b464841ac7385dec3cc47c2c60  klayout.deb" | md5sum -c -
          sudo apt-get update
          sudo apt-get install -y ./klayout.deb
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev --python 3.11
      - run: klayout -v
      - run: uv run --frozen python -m compileall -q src tests scripts
      - run: uv run --frozen python -m pytest -q --junitxml=pytest-results.xml
      - if: always() && hashFiles('pytest-results.xml') != ''
        run: >-
          uv run --frozen python scripts/write_ci_validation.py
          --junit pytest-results.xml --output validation.json
          --commit ${{ github.sha }} --job klayout-integration
          --klayout-version 0.30.10
      - if: always() && hashFiles('validation.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: validation-klayout-integration
          path: validation.json

  wheel-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install uv
      - run: uv build --wheel
      - run: uv venv wheel-smoke --python 3.11
      - run: uv pip install --python wheel-smoke/bin/python dist/*.whl
      - run: wheel-smoke/bin/python -c "import klayout_mcp; print(klayout_mcp.__version__)"
