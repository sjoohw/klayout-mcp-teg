[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "klayout-teg-mcp"
version = "0.5.0"
description = "General-purpose deterministic Manhattan layout drawing MCP for KLayout"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
klayout-teg-mcp = "klayout_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
